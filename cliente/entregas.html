<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mis Entregas</title>
        <link rel="stylesheet" href="css/styles.css">
        <script type="module" src="js/core/guard.js"></script>
        <script type="module" src="js/app-entregas.js"></script>
    </head>
    <body>
        <div class="layout-container">

        <nav id="sidebar-menu" class="sidebar">
            <h2 class="logo-texto">Poli WEB Restaurante</h2>
            <ul class="lista-menu"></ul>
        </nav>

        <main class="contenido-principal">
            <header class="cabecera-pagina">
                <h1 class="titulo-principal">Mis pedidos asignados</h1>
                <p class="subtitulo">Datos de entrega del cliente y actualización del estado del domicilio</p>
            </header>

            <div class="barra-herramientas">
                <label class="check-linea"><input type="checkbox" id="ver-entregados"> Mostrar también los ya entregados</label>
                <button id="btn-actualizar" class="btn-secundario" type="button">Actualizar</button>
            </div>

            <div id="lista-entregas" class="lista-tarjetas"></div>
        </main>

        <aside id="panel-lateral-formulario">
            <div class="cabecera-panel">
                <h2 id="panel-titulo"></h2>
                <p id="panel-subtitulo" class="subtitulo"></p>
            </div>
            <div class="contenedor-tabla">
                <table id="panel-tabla">
                    <thead><tr><th>Producto</th><th>Cant.</th><th>Observación</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <p id="panel-total" class="total-pedido"></p>
            <div class="acciones-formulario">
                <button id="btn-cerrar-panel" class="btn-secundario" type="button">Cerrar</button>
            </div>
        </aside>
        </div>
    </body>
</html>
