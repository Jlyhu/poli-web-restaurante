<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestión de Usuarios</title>
        <link rel="stylesheet" href="css/styles.css">
        <script type="module" src="js/app-login.js"></script>
    </head>
    <body>
        <div class="layout-container">

        <!-- Campos Inicio de Sesión -->
        <main class="contenido-principal">
            <header class="cabecera-pagina">
                <h1 class="titulo-principal">Iniciar sesión</h1>
                <p class="subtitulo">Ingrese sus credenciales para acceder al sistema.</p>
            </header>

            <!-- Campos Nombre y Credenciales -->
            <div class="barra-herramientas">
                <div class="campos-inicio-sesion">
                    <label for="input-nombre">Nombre</label>
                    <input type="text" id="input-nombre" placeholder="Nombre">
                </div>
                <div class="campos-inicio-sesion">
                    <label for="input-contrasena">Contraseña</label>
                    <input type="password" id="input-contrasena" placeholder="Contraseña">
                </div>
                <button id="btn-iniciar-sesion" class="btn-primario">Iniciar sesión</button>
            </div>
        </main>
    </body>
</html>
