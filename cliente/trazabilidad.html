<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Trazabilidad de Pedidos</title>
        <link rel="stylesheet" href="css/styles.css">
        <script type="module" src="js/core/guard.js"></script>
        <script type="module" src="js/app-trazabilidad.js"></script>
    </head>
    <body>
        <div class="layout-container">

        <nav id="sidebar-menu" class="sidebar">
            <h2 class="logo-texto">Poli WEB Restaurante</h2>
            <ul class="lista-menu"></ul>
        </nav>

        <main class="contenido-principal">
            <header class="cabecera-pagina">
                <h1 class="titulo-principal">Consultar trazabilidad del pedido</h1>
                <p class="subtitulo">HU-15 · Estado actual y fechas de cada pedido para hacerle seguimiento</p>
            </header>

            <div class="tarjetas-resumen" id="resumen"></div>

            <div class="filtros">
                <div class="grupo-input">
                    <label for="buscar-pedido">N.º de pedido</label>
                    <input type="number" id="buscar-pedido" min="1" placeholder="Ej. 9203">
                </div>
                <div class="grupo-input">
                    <label for="filtro-estado">Estado</label>
                    <select id="filtro-estado">
                        <option value="">Todos</option>
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="EN PREPARACION">En preparación</option>
                        <option value="LISTO">Listo</option>
                        <option value="ENTREGADO">Entregado</option>
                        <option value="CANCELADO">Cancelado</option>
                    </select>
                </div>
                <div class="grupo-input">
                    <label for="filtro-tipo">Tipo</label>
                    <select id="filtro-tipo">
                        <option value="">Todos</option>
                        <option value="mesa">Mesa</option>
                        <option value="domicilio">Domicilio</option>
                    </select>
                </div>
                <button id="btn-actualizar" class="btn-secundario" type="button">Actualizar</button>
            </div>

            <div class="contenedor-tabla">
                <table id="tabla-pedidos">
                    <thead>
                        <tr><th>Pedido</th><th>Destino</th><th>Atiende</th><th>Estado</th><th>Creado</th><th>Última actualización</th><th>Minutos</th><th>Pago</th><th>Acción</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>

        <!-- PANEL LATERAL: línea de tiempo + detalle -->
        <aside id="panel-lateral-formulario">
            <div class="cabecera-panel">
                <h2 id="panel-titulo"></h2>
                <p id="panel-subtitulo" class="subtitulo"></p>
            </div>
            <h3 class="titulo-panel-seccion">Línea de tiempo</h3>
            <ul id="panel-eventos" class="linea-tiempo"></ul>
            <dl id="panel-datos" class="datos-pedido"></dl>
            <h3 class="titulo-panel-seccion">Productos</h3>
            <div class="contenedor-tabla">
                <table id="panel-tabla">
                    <thead><tr><th>Producto</th><th>Cant.</th><th>Observación</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <p id="panel-total" class="total-pedido"></p>
            <div class="acciones-formulario">
                <button id="btn-cerrar-panel" class="btn-secundario" type="button">Cerrar</button>
            </div>
        </aside>

        </div>
    </body>
</html>
