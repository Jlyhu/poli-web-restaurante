<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestión de Productos</title>
        <link rel="stylesheet" href="css/styles.css">
        <script type="module" src="js/core/guard.js"></script>
        <script type="module" src="js/app-productos.js"></script>
    </head>
    <body>
        <div class="layout-container">
        
        <!-- 1. MENÚ LATERAL IZQUIERDO -->
        <nav id="sidebar-menu" class="sidebar">
            <h2 class="logo-texto">Poli WEB Restaurante</h2>
            <ul class="lista-menu">
            </ul>
        </nav>

<!-- 2. CONTENIDO PRINCIPAL -->
        <main class="contenido-principal">
            <header class="cabecera-pagina">
                <h1 class="titulo-principal">Gestionar Productos</h1>
                <p class="subtitulo">Administra los productos del menú y la categoría a la que pertenecen.</p>
            </header>

            <!-- Barra de herramientas (Buscador y Botón Crear) -->
            <div class="barra-herramientas">
                <div class="buscador">
                    <label for="buscar">Buscar producto</label>
                    <input type="text" id="buscar" placeholder="Nombre">
                </div>
                <button id="btn-crear-producto" class="btn-primario">Crear producto</button>
            </div>

            <!-- Tabla de Productos -->
            <div class="contenedor-tabla">
                <table id="tabla-productos">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Disponibilidad</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Aquí ProductoView.js inyectará las filas (<tr>) dinámicamente -->
                    </tbody>
                </table>
            </div>
        </main>

        <!-- 3. PANEL LATERAL OCULTO (Off-canvas para Crear/Editar) -->
        <aside id="panel-lateral-formulario" class="panel-lateral">
            <div class="cabecera-panel">
                <h2 id="titulo-panel">Crear producto</h2>
            </div>

            <form id="form-producto">
                <div class="grupo-input">
                    <label for="input-nombre">Nombre *</label>
                    <input type="text" id="input-nombre" maxlength="100" required>
                </div>

                <div class="grupo-input">
                    <label for="input-descripcion">Descripción</label>
                    <input type="text" id="input-descripcion" maxlength="100">
                </div>

                <div class="grupo-input">
                    <label for="input-precio">Precio *</label>
                    <input type="number" id="input-precio" min="0" step="0.01" required>
                </div>

                <div class="grupo-input">
                    <label for="input-cantidad">Cantidad disponible *</label>
                    <input type="number" id="input-cantidad" min="0" step="1" value="0" required>
                </div>

                <div class="grupo-input">
                    <label for="select-categoria">Categoría *</label>
                    <select id="select-categoria" required>
                        <!-- Aquí ProductoView.js cargará las categorías -->
                    </select>
                </div>

                <div class="acciones-formulario">
                    <button type="submit" id="btn-guardar" class="btn-primario">Crear</button>
                    <div class="acciones-inferiores">
                        <button type="button" id="btn-cancelar" class="btn-texto">Descartar</button>
                        <button type="button" id="btn-eliminar" class="btn-texto btn-peligro oculto">Eliminar producto</button>
                    </div>
                </div>
            </form>
        </aside>

    </div>
    </body>
</html>
