<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestión de Disponibilidad</title>
        <link rel="stylesheet" href="css/styles.css">
        <script type="module" src="js/core/guard.js"></script>
        <script type="module" src="js/app-disponibilidad.js"></script>
    </head>
    <body>
        <div class="layout-container">

        <!-- 1. MENÚ LATERAL IZQUIERDO -->
        <nav id="sidebar-menu" class="sidebar">
            <h2 class="logo-texto">Poli WEB Restaurante</h2>
            <ul class="lista-menu">
            </ul>
        </nav>

        <!-- 2. CONTENIDO PRINCIPAL -->
        <main class="contenido-principal">
            <header class="cabecera-pagina">
                <h1 class="titulo-principal">Gestionar Disponibilidad</h1>
            </header>

            <!-- Barra de herramientas (Buscador y Filtro) -->
            <div class="barra-herramientas">
                <div class="buscador">
                    <label for="buscar">Buscar producto</label>
                    <input type="text" id="buscar" placeholder="Nombre">
                </div>
                <div class="buscador">
                    <label for="select-filtro">Mostrar</label>
                    <select id="select-filtro">
                        <option value="todos">Todos</option>
                        <option value="disponibles">Solo disponibles</option>
                        <option value="agotados">Solo agotados</option>
                    </select>
                </div>
            </div>

            <!-- Tabla de Disponibilidad -->
            <div class="contenedor-tabla">
                <table id="tabla-disponibilidad">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Estado</th>
                            <th>Cantidad</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Aquí DisponibilidadView.js inyectará las filas (<tr>) dinámicamente -->
                    </tbody>
                </table>
            </div>
        </main>

    </div>
    </body>
</html>
